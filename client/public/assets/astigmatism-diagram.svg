<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title description">
  <title id="title">Normal vision and astigmatism</title>
  <desc id="description">Light rays focus at one point in a normal eye and at different points in an eye with astigmatism.</desc>
  <defs><radialGradient id="eye"><stop stop-color="#fbd26d"/><stop offset=".65" stop-color="#f4834e"/><stop offset="1" stop-color="#d44731"/></radialGradient><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0 5 2.5 0 5" fill="none" stroke="#f6b900"/></marker></defs>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15325a" text-anchor="middle"><text x="180" y="24">Normal eye</text><text x="540" y="24">Astigmatism</text></g>
  <g transform="translate(180 100)"><ellipse rx="81" ry="61" fill="url(#eye)" stroke="#1f6ca8" stroke-width="5"/><path d="M-80-24 Q-47 0 -80 24" fill="#c5eefb" stroke="#1f6ca8" stroke-width="4"/><path d="M-76-22 Q-44 0 -76 22" fill="none" stroke="#15669f" stroke-width="3"/><path d="M81-9 Q112-9 116 3 L82 10" fill="#edd295" stroke="#1f6ca8" stroke-width="4"/><circle cx="63" r="5" fill="#ffefb6"/><g fill="none" stroke="#ffc400" stroke-width="3"><path d="M-165-22 H-70 L63 0"/><path d="M-165 0 H-70 L63 0"/><path d="M-165 22 H-70 L63 0"/></g></g>
  <g transform="translate(540 100)"><ellipse rx="81" ry="61" fill="url(#eye)" stroke="#1f6ca8" stroke-width="5"/><path d="M-80-24 Q-35 0 -80 24" fill="#c5eefb" stroke="#1f6ca8" stroke-width="4"/><path d="M-76-22 Q-33 0 -76 22" fill="none" stroke="#15669f" stroke-width="3"/><path d="M81-9 Q112-9 116 3 L82 10" fill="#edd295" stroke="#1f6ca8" stroke-width="4"/><circle cx="48" cy="-9" r="4" fill="#ffefb6"/><circle cx="67" cy="8" r="4" fill="#ffefb6"/><g fill="none" stroke="#ffc400" stroke-width="3"><path d="M-165-22 H-70 L48-9"/><path d="M-165 0 H-70 L62 0"/><path d="M-165 22 H-70 L67 8"/></g></g>
</svg>
